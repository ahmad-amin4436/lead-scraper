# Netlify configuration for LeadMine AI.
#
# The app is serverless-ready: all data (leads, settings, history, exports, logs,
# and job state) persists to Netlify Blobs, and long searches run in a Background
# Function (up to 15 minutes) with the browser polling for live progress. No
# persistent volume or long-lived process is required.
#
# See the Deployment section of README.md.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.9.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify configuration for LeadMine AI.
#
# This deploys the front end only. Leads, users and search runs live in the .NET
# API, which also runs the scraper as an in-process background service — so there
# is no Background Function here and no 15-minute ceiling to work around. Set
# BACKEND_API_URL to the deployed API.
#
# Settings, exports and logs still persist to Netlify Blobs, so no persistent
# volume is required for the front end either.
#
# See the Deployment section of README.md.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.9.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Runs the API and the scraper workers together.
#
# `restart: unless-stopped` is the other half of the reliability story: the job
# lease in SQL makes a dead worker recoverable, and this makes a dead worker
# come back. Neither alone is enough.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Supply real values from the host environment or a secrets manager —
      # never bake them into the image.
      ConnectionStrings__DefaultConnection: ${LEADMINE_DB_CONNECTION}
      Jwt__Key: ${LEADMINE_JWT_KEY}
      ServiceKey: ${LEADMINE_SERVICE_KEY}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASS}
      Smtp__FromAddress: ${SMTP_USER}
    ports:
      - '8080:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      LEADMINE_API_URL: http://api:8080
      LEADMINE_SERVICE_KEY: ${LEADMINE_SERVICE_KEY}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      # Lease length. Shorter recovers faster after a crash; longer tolerates a
      # slower task without the job being reclaimed mid-flight.
      WORKER_LEASE_SECONDS: '120'
      WORKER_CONCURRENCY: '1'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Scale horizontally with `docker compose up --scale worker=3`. Claims are
    # atomic, so no job is ever run by two workers at once.
    deploy:
      replicas: 1
